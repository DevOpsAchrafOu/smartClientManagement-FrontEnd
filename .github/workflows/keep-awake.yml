# Keeps API version 2 and the AI service (used by the redesign) awake during working hours, so visitors don't
# wait about a minute for a free Render service to start.
#
# Only on weekdays, 08:00–19:00 Morocco time (07:00–18:59 UTC): about 240 hours a month per service, so about
# 480 hours for both, under the 750 free hours Render gives the whole workspace. Keeping them awake 24/7 would
# use more than all of them. GitHub may start scheduled runs a few minutes late; that is fine here.
name: Keep API v2 and AI service awake

on:
  schedule:
    - cron: "*/10 7-18 * * 1-5"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        service:
          - smartclientmanagement-api-v2
          - smartclientmanagement-ai-service
    steps:
      - name: Ping the health check
        run: |
          for attempt in 1 2 3; do
            if curl -fsS --max-time 90 https://${{ matrix.service }}.onrender.com/actuator/health; then
              exit 0
            fi
            sleep 20
          done
          echo "::warning::${{ matrix.service }} did not answer"
