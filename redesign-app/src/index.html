<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>SmartClient — Gestion des clients</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="SmartClient : gestion des utilisateurs, rôles, menus, pays et villes. Refonte Angular 22 + Tailwind CSS.">
  <meta name="theme-color" content="#4f46e5">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://smartclientmanagement-api-v2.onrender.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    /* Apply the saved theme and language before the first paint (no flash). */
    try {
      var t = localStorage.getItem('scm_theme');
      if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
      if (localStorage.getItem('scm_lang') === 'ar') { document.documentElement.lang = 'ar'; document.documentElement.dir = 'rtl'; }
    } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
